spring:
  application:
    name: __BACKEND_ARTIFACT__
  datasource:
    url: jdbc:postgresql://localhost:5432/demo
    username: demo
    password: demo
  data:
    redis:
      host: localhost
      port: 6379
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: true
      logic-not-delete-value: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
