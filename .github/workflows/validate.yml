name: validate

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate skill package
        run: node skills/spring-vue-stack/scripts/validate.mjs
